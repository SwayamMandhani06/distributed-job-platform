# ===========================================================================
# Prometheus Configuration for Distributed Job Platform Observability
# Phase 7 — Observability, Security and Operational Hardening
# ===========================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "job-platform-scheduler"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["scheduler:8000"]
